name: Update changelog

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes
  push: # fills the changelog automatically the first time this is pushed
    branches: [main]
    paths:
      - ".github/workflows/update-changelog.yml"
      - "scripts/update-changelog.mjs"
  workflow_dispatch: # "Run workflow" button in the Actions tab
  repository_dispatch: # optional instant trigger from the RGOS repo
    types: [rgos-commit]

permissions:
  contents: write

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild docs/changelog.html from RGOS commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: RGOS-CFW/RGOS
          # BRANCH: main        # uncomment to pin a branch (default: repo default)
          # TZ_NAME: America/Halifax   # day grouping timezone (default: UTC)
        run: node scripts/update-changelog.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/changelog.html
          git commit -m "docs: update changelog"
          git push
